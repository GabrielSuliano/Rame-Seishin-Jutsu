<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Rame Seishin Jutsu</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/eventos.css">
  <script type="module" src="/painel-assets/admin.js"></script>
</head>
<body>
  <main class="conteiner area-eventos">
    <p><a href="/">← Voltar ao site</a></p>
    <h1>Painel do Rame</h1>
    <p id="aviso" role="status" aria-live="polite"></p>

    <form id="login" class="formulario-painel" hidden>
      <h2>Entrar</h2>
      <label>Nome de usuário <input name="nome" autocomplete="username" required></label>
      <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
      <button class="botao botao-primario">Entrar</button>
    </form>

    <div id="painel" hidden>
      <nav class="acoes-painel" aria-label="Administração">
        <a href="#secao-eventos">Eventos</a>
        <a href="#secao-fotos">Fotos do site</a>
        <a href="#secao-senha">Mudar senha</a>
        <button type="button" class="botao botao-secundario" id="sair">Sair</button>
      </nav>

      <section id="secao-eventos" class="secao-painel">
        <form id="formulario-evento" class="formulario-painel">
          <h2 id="titulo-formulario">Publicar evento</h2>
          <label>Título <input name="titulo" maxlength="120" required></label>
          <label>Descrição <textarea name="descricao" maxlength="4000" rows="6" required></textarea></label>
          <fieldset id="fotos-atuais" hidden>
            <legend>Desmarque as fotos que deseja retirar</legend>
            <div id="selecao-fotos" class="grade-eventos"></div>
          </fieldset>
          <label>Adicionar fotos (até 4 por envio, 6 MB cada)
            <input name="fotos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          </label>
          <div class="acoes-painel">
            <button class="botao botao-primario">Salvar e publicar</button>
            <button type="button" class="botao botao-secundario" id="cancelar-edicao" hidden>Cancelar edição</button>
          </div>
        </form>
        <h2>Eventos publicados</h2>
        <div id="lista-eventos" class="grade-eventos"></div>
      </section>

      <section id="secao-fotos" class="secao-painel">
        <h2>Fotos do site</h2>
        <p>Uma troca vale para todas as páginas onde essa foto aparece.</p>
        <div id="lista-fotos-site" class="grade-eventos"></div>
      </section>

      <section id="secao-senha" class="secao-painel">
        <form id="formulario-senha" class="formulario-painel">
          <h2>Mudar senha</h2>
          <label>Senha atual <input name="senhaAtual" type="password" autocomplete="current-password" required></label>
          <label>Nova senha <input name="novaSenha" type="password" autocomplete="new-password" minlength="12" required></label>
          <label>Confirme a nova senha <input name="confirmacao" type="password" autocomplete="new-password" minlength="12" required></label>
          <button class="botao botao-primario">Salvar senha</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
